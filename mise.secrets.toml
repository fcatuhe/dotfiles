# Only loaded on machines holding the age identity (~/.config/mise/age.txt).
# mise decrypts [vars] on every config load, so a machine without the key
# cannot merely skip the templates, it must not load the vars at all.

# Template targets inherit the source file's mode, and git only tracks the exec
# bit, so a fresh clone would render secrets as 644 without this.
[bootstrap.hooks.pre-dotfiles]
run = "chmod 600 ssh/config.tmpl aws/config.tmpl zsh/zshenv.private.tmpl agent-browser/encryption-key.tmpl"

[dotfiles]
"~/.zshenv.private" = { source = "zsh/zshenv.private.tmpl", mode = "template" }
"~/.ssh/config" = { source = "ssh/config.tmpl", mode = "template" }
"~/.aws/config" = { source = "aws/config.tmpl", mode = "template" }
"~/.agent-browser/.encryption-key" = { source = "agent-browser/encryption-key.tmpl", mode = "template" }
"~/.agent-browser/auth" = "agent-browser/auth"

[vars]
SSH_AZADE_IP = { age = "" }
SSH_AZADE_USER = { age = "" }
SSH_PATOUMATIC_IP = { age = "" }
SSH_PATOUMATIC_USER = { age = "" }
SSH_CROOZ_IP = { age = "" }
SSH_CROOZ_USER = { age = "" }
AWS_SSO_START_URL = { age = "" }
AWS_SSO_ACCOUNT_ID = { age = "" }
BRAVE_API_KEY = { age = "" }
