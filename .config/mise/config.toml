[tools]
btop = "latest"
"fnox" = "latest"
gdu = "latest"
"gh" = "latest"
"github:openclaw/gogcli" = "latest"
"node" = "lts"
"npm:@getpaseo/cli" = "latest"
"pi" = "latest"
"ruby" = "latest"

# Empty password on purpose: the gog file keyring needs it set to work without a TTY.
[env]
GOG_KEYRING_PASSWORD = ""

# Projects pin Ruby in .ruby-version, not in mise.toml.
[settings]
idiomatic_version_file_enable_tools = ["ruby"]

# Prebuilt Ruby instead of compiling each version.
[settings.ruby]
compile = false
