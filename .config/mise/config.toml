[tools]
bun = "latest"
fnox = "latest"
"github:getpaseo/paseo" = { version = "latest", asset_pattern = "Paseo-*-x64.tar.gz", strip_components = 1, bin_path = "resources/bin" }
"github:steipete/gogcli" = "latest"
herdr = "latest"
npm = "latest"
"npm:agent-browser" = "latest"
ruby = "latest"
scaleway = "latest"
stripe = "latest"

[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
compile = false
