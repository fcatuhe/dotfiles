[dotfiles]
"~/.gitconfig.local" = "git/identity"
"~/.config/git/allowed_signers" = "git/allowed_signers"
"~/.zprofile" = "zsh/zprofile"
"~/.config/ghostty/config" = "ghostty/config"
"~/.config/mise/config.toml" = "mise-global/config.toml"
"~/Library/Application Support/VSCodium/User/settings.json" = "vscodium/settings.json"
# openlogi rewrites its config in place, which breaks a symlink. Capture edits
# back into the repo with: mise dotfiles add ~/.config/openlogi/config.toml
"~/.config/openlogi/config.toml" = { source = "openlogi/config.toml", mode = "copy" }

# Hotkey 60 is "Select the previous input source" on ctrl+space, which swallows the key before the terminal sees it.
# activateSettings applies it without a logout. The XML value keeps enabled a real boolean: the old-style { enabled = 0 } stores a string that activateSettings ignores.
# mru-spaces off stops macOS reordering Spaces by recent use. The Dock reads it only at launch, so it restarts once, when the value changes.
# Hot corners: none, except bottom right puts the display to sleep (10). 1 is the value System Settings writes for none.
# Key repeat at the System Settings maximum, in 15ms units: 30ms per repeat after a 225ms delay. Apps pick it up at launch.
[tasks."setup:darwin"]
run = [
  "defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add 60 '<dict><key>enabled</key><false/><key>value</key><dict><key>type</key><string>standard</string><key>parameters</key><array><integer>32</integer><integer>49</integer><integer>262144</integer></array></dict></dict>'",
  "defaults write -g KeyRepeat -float 2",
  "defaults write -g InitialKeyRepeat -float 15",
  "/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u",
  "[ \"$(defaults read com.apple.dock mru-spaces 2>/dev/null)\" = 0 ] || { defaults write com.apple.dock mru-spaces -bool false && killall Dock; }",
  "[ \"$(for c in tl tr bl br; do defaults read com.apple.dock wvous-$c-corner 2>/dev/null; done | xargs)\" = '1 1 1 10' ] || { for c in tl tr bl; do defaults write com.apple.dock wvous-$c-corner -int 1; done && defaults write com.apple.dock wvous-br-corner -int 10 && defaults write com.apple.dock wvous-br-modifier -int 0 && killall Dock; }",
]

[tasks."setup:vscodium"]
run = [
  "[ -d /Applications/VSCodium.app ] || brew install --cask vscodium",
  "codium --install-extension esbenp.prettier-vscode",
  "codium --install-extension github.vscode-pull-request-github",
  "codium --install-extension marcoroth.herb-lsp",
  "codium --install-extension marcoroth.stimulus-lsp",
  "codium --install-extension marcoroth.turbo-lsp",
  "codium --install-extension shopify.ruby-lsp",
  "codium --install-extension sianglim.slim",
]

[tasks."vscodium:dump"]
description = "Snapshot VSCodium's activity bar, status bar and view layout into vscodium/layout.sql"
run = '''
sqlite3 -readonly ~/Library/Application\ Support/VSCodium/User/globalStorage/state.vscdb ".mode insert ItemTable" "
  SELECT key, value FROM ItemTable WHERE key IN (
    'workbench.activity.pinnedViewlets2',
    'workbench.activity.showAccounts',
    'workbench.explorer.views.state.hidden',
    'workbench.scm.views.state.hidden',
    'workbench.statusbar.hidden'
  ) ORDER BY key" > vscodium/layout.sql
'''

[tasks."vscodium:apply"]
description = "Write vscodium/layout.sql into VSCodium's state, effective at next launch"
run = '''
if pgrep -x VSCodium > /dev/null; then
  echo "vscodium:apply: quit VSCodium first, it writes its state back on exit" >&2
  exit 1
fi
mkdir -p ~/Library/Application\ Support/VSCodium/User/globalStorage
{
  echo "CREATE TABLE IF NOT EXISTS ItemTable (key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB);"
  cat vscodium/layout.sql
} | sqlite3 ~/Library/Application\ Support/VSCodium/User/globalStorage/state.vscdb
'''
