[dotfiles]
"~/.pi/agent/settings.json" = "agents/pi/settings.json"
"~/.pi/agent/extensions/pi-model-shortcuts.json" = "agents/pi/extensions/pi-model-shortcuts.json"
"~/.pi/agent/extensions/herdr-preview.json" = "agents/pi/extensions/herdr-preview.json"
# Extension state dir, not an extension: siblings runs/ and agents/ stay local, so link the file alone.
"~/.pi/agent/pi-codex-subagents/config.json" = "agents/pi/pi-codex-subagents/config.json"
"~/.config/herdr/config.toml" = "agents/herdr/config.toml"

# Both tools self-update, so this only has to cover a machine that lacks them.
[tasks."setup:agents"]
run = [
  "command -v pi >/dev/null || curl -fsSL https://pi.dev/install.sh | sh",
  "command -v herdr >/dev/null || curl -fsSL https://herdr.dev/install.sh | sh",
]
