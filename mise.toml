[settings]
experimental = true

[bootstrap.apt.sources.tailscale]
uris = "https://pkgs.tailscale.com/stable/debian"
key = "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
fingerprint = "2596 A99E AAB3 3821 893C  0A79 458C A832 957F 5868"

[bootstrap.packages]
"apt:tailscale" = "latest"

[dotfiles]
"~/.config/mise/config.toml" = {}

# Run by mise bootstrap, once the dotfiles are in place
[tasks.bootstrap]
depends = ["setup:*"]

# Lets francois run tailscale serve without sudo, as patoumatic's bin/dev --tailscale does
[tasks."setup:tailscale-operator"]
run = "sudo tailscale set --operator=$USER"
