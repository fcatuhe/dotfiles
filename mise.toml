[settings]
# Required for [vars] age encryption. Decryption identity: ~/.config/mise/age.txt
experimental = true

# Template targets inherit the source file's mode, and git only tracks the exec
# bit, so a fresh clone would render secrets as 644 without this.
[bootstrap.hooks.pre-dotfiles]
run = "chmod 600 ssh/config.tmpl aws/config.tmpl zsh/zshenv.private.tmpl agent-browser/encryption-key.tmpl"

[dotfiles]
# --- Shell ---
"~/.zshenv" = "zsh/zshenv"
"~/.zshrc" = "zsh/zshrc"
"~/.aliases" = "zsh/aliases"

# --- Version control ---
"~/.gitconfig" = "git/config"
"~/.config/git/ignore" = "git/ignore"
"~/.config/gh/config.yml" = "gh/config.yml"
"~/.config/gh/hosts.yml" = "gh/hosts.yml"

# --- Package managers ---
"~/.npmrc" = "npm/npmrc"

# --- CLI tools ---
"~/.local/bin/z" = "bin/z"
"~/.config/ghostty/config" = "ghostty/config"

[vars]
SSH_AZADE_IP = { age = "" }
SSH_AZADE_USER = { age = "" }
SSH_PATOUMATIC_IP = { age = "" }
SSH_PATOUMATIC_USER = { age = "" }
SSH_CROOZ_IP = { age = "" }
SSH_CROOZ_USER = { age = "" }
AWS_SSO_START_URL = { age = "" }
AWS_SSO_ACCOUNT_ID = { age = "" }
BRAVE_API_KEY = { age = "" }
FIREWORKS_API_KEY = { age = "" }
SSH_FLYZILLA_IP = { age = "" }
SSH_FLYZILLA_USER = { age = "" }
RIDECELL_INFERENCE_API_KEY = { age = "" }
AGENT_BROWSER_ENCRYPTION_KEY = { age = "" }
SSH_VAST_AI_IP = { age = "" }
SSH_VAST_AI_PORT = { age = "" }
SSH_VAST_AI_USER = { age = "" }
