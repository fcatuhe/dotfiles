[settings]
experimental = true

# Bitwarden comes first by hand, the bootstrap only keeps it installed
[bootstrap.packages]
"pacman:ansible" = "latest"
"pacman:bitwarden" = "latest"
"pacman:bitwarden-cli" = "latest"
"pacman:brave-origin-bin" = "latest"
"pacman:fwupd" = "latest"
"pacman:zsh" = "latest"
"pacman:zsh-autosuggestions" = "latest"
"pacman:zsh-syntax-highlighting" = "latest"
"aur:sunsetr-bin" = "latest"
"aur:vscodium-bin" = "latest"

# Downloads the firmware metadata the updates widget reads offline
[bootstrap.services."fwupd-refresh.timer"]
enabled = true

# Repositories cloned before the dotfiles, which write key files into the fcode ones. gh runs script extensions like gh-signoff from a clone
[bootstrap.repos]
"~/.local/share/gh/extensions/gh-signoff" = { url = "https://github.com/basecamp/gh-signoff.git" }
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/fcode/crooz" = { url = "git@github.com:fcatuhe/crooz.git" }
"~/fcode/patoumatic" = { url = "git@github.com:fcatuhe/patoumatic.git" }
"~/fcode/pi-wares" = { url = "git@github.com:fcatuhe/pi-wares.git" }
"~/fcode/skyblip" = { url = "git@github.com:fcatuhe/skyblip.git" }

[bootstrap.secrets]
PATOUMATIC_SERVER_IP = "PATOUMATIC_SERVER_IP"
PATOUMATIC_SERVER_USER = "PATOUMATIC_SERVER_USER"
CROOZ_SERVER_IP = "CROOZ_SERVER_IP"
CROOZ_SERVER_USER = "CROOZ_SERVER_USER"
AZADE_SERVER_IP = "AZADE_SERVER_IP"
AZADE_SERVER_USER = "AZADE_SERVER_USER"
BADGER_SERVER_IP = "BADGER_SERVER_IP"
BADGER_SERVER_USER = "BADGER_SERVER_USER"
SCALEWAY_ACCESS_KEY = "SCALEWAY_ACCESS_KEY"
SCALEWAY_SECRET_KEY = "SCALEWAY_SECRET_KEY"
SCALEWAY_ORGANIZATION_ID = "SCALEWAY_ORGANIZATION_ID"
SCALEWAY_PROJECT_ID = "SCALEWAY_PROJECT_ID"
PATOUMATIC_RAILS_DEVELOPMENT_KEY = "PATOUMATIC_RAILS_DEVELOPMENT_KEY"
CROOZ_RAILS_DEVELOPMENT_KEY = "CROOZ_RAILS_DEVELOPMENT_KEY"

[dotfiles]
"~/.XCompose" = {}
"~/.bashrc" = {}
"~/.config/VSCodium/User/settings.json" = {}
"~/.config/foot/foot.ini" = { mode = "copy" }
"~/.config/gh/config.yml" = {}
"~/.config/git/allowed_signers" = {}
"~/.config/git/config" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/hypr/autostart.lua" = {}
"~/.config/hypr/bindings.lua" = {}
"~/.config/hypr/hyprland.lua" = {}
"~/.config/hypr/input.lua" = {}
"~/.config/hypr/looknfeel.lua" = {}
"~/.config/hypr/monitors.lua" = { mode = "copy" }
"~/.config/mimeapps.list" = { mode = "copy" }
"~/.config/mise/config.toml" = {}
"~/.config/omarchy/defaults/agent" = {}
"~/.config/omarchy/plugins/francois.keyboard-layout/KeyboardLayout.qml" = {}
"~/.config/omarchy/plugins/francois.keyboard-layout/KeyboardLayoutModel.js" = {}
"~/.config/omarchy/plugins/francois.keyboard-layout/manifest.json" = {}
"~/.config/omarchy/plugins/francois.updates/Service.qml" = {}
"~/.config/omarchy/plugins/francois.updates/Updates.qml" = {}
"~/.config/omarchy/plugins/francois.updates/manifest.json" = {}
"~/.config/omarchy/plugins/francois.updates/updates-pending" = {}
"~/.config/omarchy/shell.json" = { mode = "copy" }
"~/.config/scw/config.yaml" = { source = ".config/scw/config.yaml.tmpl", mode = "template", permissions = "0600" }
"~/.config/shell/aliases" = {}
"~/.config/sunsetr/sunsetr.toml" = {}
"~/.config/tmux/tmux.conf" = {}
"~/.config/uwsm/env.d/bitwarden-ssh" = {}
"~/.config/uwsm/env.d/console1984" = {}
"~/.config/uwsm/env.d/editor" = {}
"~/.config/uwsm/env.d/npm" = {}
"~/.config/voxtype/config.toml" = { mode = "copy" }
"~/.config/xkb/rules/evdev" = {}
"~/.config/xkb/rules/evdev.xml" = {}
"~/.config/xkb/symbols/frenchy" = {}
"~/.config/xkb/types/frenchy" = {}
"~/.pi/agent/keybindings.json" = {}
"~/.pi/agent/mcp.json" = {}
"~/.pi/agent/settings.json" = {}
"~/.ssh/config" = { source = ".ssh/config.tmpl", mode = "template", permissions = "0600" }
"~/.zshrc" = {}
"~/fcode/crooz/config/master.key" = { source = "fcode/crooz/config/master.key.tmpl", mode = "template", permissions = "0600" }
"~/fcode/patoumatic/config/master.key" = { source = "fcode/patoumatic/config/master.key.tmpl", mode = "template", permissions = "0600" }

# Run by mise bootstrap, once the dotfiles are in place
[tasks.bootstrap]
depends = ["setup:*"]

[tasks."bios:dump"]
description = "Snapshot the BIOS settings and UEFI boot entries into bios/<model>-<machine type>"
run = '''
dir=bios/$(printf '%s-%.4s' "$(cat /sys/class/dmi/id/product_version)" "$(cat /sys/class/dmi/id/product_name)" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/-$//')
mkdir -p "$dir"
raw=$(mktemp)
sudo -v
sudo sh -ec 'cd /sys/class/firmware-attributes/thinklmi/attributes; for a in */; do printf "%s=" "${a%/}"; cat "$a/current_value"; done' > "$raw"
LC_ALL=C sort "$raw" > "$dir/settings.txt"
rm "$raw"
efibootmgr | grep -v -E '^Boot(Current|Next):' > "$dir/efibootmgr.txt"
cat /sys/class/dmi/id/bios_version > "$dir/bios-version.txt"
'''

[tasks."bios:apply"]
description = "Write the bios/<model>-<machine type> settings that differ from the firmware, effective at next reboot"
raw = true
run = '''
dir=bios/$(printf '%s-%.4s' "$(cat /sys/class/dmi/id/product_version)" "$(cat /sys/class/dmi/id/product_name)" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/-$//')
lmi=/sys/class/firmware-attributes/thinklmi
sudo -v
read -rsp 'Supervisor password (Enter if none): ' pw; echo
printf '%s' "$pw" | sudo tee $lmi/authentication/Admin/current_password > /dev/null
unset pw
trap "echo | sudo tee $lmi/authentication/Admin/current_password > /dev/null" EXIT
while IFS='=' read -r name value; do
  current=$(sudo cat "$lmi/attributes/$name/current_value")
  [ "$current" = "$value" ] && continue
  printf '%s' "$value" | sudo tee "$lmi/attributes/$name/current_value" > /dev/null
  echo "$name: $current -> $value"
done < "$dir/settings.txt"
'''

[tasks."vscodium:dump"]
description = "Snapshot VSCodium's activity bar, status bar and view layout into vscodium/layout.sql"
run = '''
sqlite3 -readonly ~/.config/VSCodium/User/globalStorage/state.vscdb ".mode insert ItemTable" "
  SELECT key, value FROM ItemTable WHERE key IN (
    'workbench.activity.pinnedViewlets2',
    'workbench.activity.showAccounts',
    'workbench.explorer.views.state.hidden',
    'workbench.scm.views.state.hidden',
    'workbench.statusbar.hidden'
  ) ORDER BY key" > vscodium/layout.sql
'''

[tasks."vscodium:apply"]
description = "Write vscodium/layout.sql into VSCodium's state, effective at next launch"
run = '''
if pgrep -x codium > /dev/null; then
  echo "vscodium:apply: quit VSCodium first, it writes its state back on exit" >&2
  exit 1
fi
mkdir -p ~/.config/VSCodium/User/globalStorage
{
  echo "CREATE TABLE IF NOT EXISTS ItemTable (key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB);"
  cat vscodium/layout.sql
} | sqlite3 ~/.config/VSCodium/User/globalStorage/state.vscdb
'''

[tasks."brave-origin:apply"]
description = "Merge the settings Brave Sync skips into the Brave Origin profile, effective at next launch"
run = '''
set -e
profile=~/.config/BraveSoftware/Brave-Origin
lock=$(readlink "$profile/SingletonLock" || true)
if [ -n "$lock" ] && kill -0 "${lock##*-}" 2> /dev/null; then
  echo "brave-origin:apply: quit Brave Origin first, it writes its preferences back on exit" >&2
  exit 1
fi
if [ ! -f "$profile/Default/Preferences" ]; then
  echo "brave-origin:apply: launch Brave Origin once first, to create its profile" >&2
  exit 1
fi
umask 077
for pair in "Default/Preferences:brave-origin/preferences.json" "Local State:brave-origin/local-state.json"; do
  target="$profile/${pair%%:*}"
  jq -s '.[0] * .[1]' "$target" "${pair#*:}" > "$target.tmp"
  mv "$target.tmp" "$target"
done
'''

# Omarchy's theme color policy folder, Wayland flags and browser extensions, then Web Bluetooth and crash reports off
[tasks."setup:brave-origin"]
run = [
  "omarchy-install-browser brave-origin",
  "sed -i -E 's/^--enable-features=.*/&,BraveWebBluetoothAPI,WebBluetooth/' ~/.config/brave-origin-flags.conf",
  "grep -q '^--enable-features=.*,BraveWebBluetoothAPI,WebBluetooth$' ~/.config/brave-origin-flags.conf",
  "sudo install -m 644 brave-origin/metrics.json /etc/brave/policies/managed/metrics.json",
]

[tasks."setup:limine"]
run = [
  "sudo sed -i -E -e '/^quiet:/d' -e 's/^#?timeout:.*/timeout: 1\\nquiet: yes/' /boot/limine.conf",
  "sudo grep -qx 'timeout: 1' /boot/limine.conf",
  "sudo grep -qx 'quiet: yes' /boot/limine.conf",
]

[tasks."setup:power-profile"]
run = "omarchy-powerprofiles-set ac balanced"

# Own projects only: a third-party repo like oh-my-zsh would get its mise config trusted
[tasks."setup:repos"]
run = '''mise bootstrap repos exec -- sh -c 'case "$PWD" in "$HOME"/fcode/*) mise trust --quiet && mise install ;; esac' '''

[tasks."setup:vscodium"]
run = [
  "codium --install-extension esbenp.prettier-vscode",
  "codium --install-extension github.vscode-pull-request-github",
  "codium --install-extension marcoroth.herb-lsp",
  "codium --install-extension marcoroth.stimulus-lsp",
  "codium --install-extension marcoroth.turbo-lsp",
  "codium --install-extension shopify.ruby-lsp",
  "codium --install-extension sianglim.slim",
]
