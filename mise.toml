[settings]
experimental = true

[bootstrap.apt.sources.tailscale]
uris = "https://pkgs.tailscale.com/stable/debian"
key = "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
fingerprint = "2596 A99E AAB3 3821 893C  0A79 458C A832 957F 5868"

[bootstrap.packages]
"apt:tailscale" = "latest"
"apt:sysstat" = "latest"
"apt:zsh" = "latest"
"apt:zsh-autosuggestions" = "latest"
"apt:zsh-syntax-highlighting" = "latest"

# Keeps 28 days of system activity, read with sar, to size the server from its RAM and CPU history
[bootstrap.files."/etc/sysstat/sysstat"]
content = """
HISTORY=28
COMPRESSAFTER=10
SADC_OPTIONS="-S DISK"
SA_DIR=/var/log/sysstat
ZIP="xz"
DELAY_RANGE=0
UMASK=0022
"""

# Samples on each minute instead of every 10, so short peaks show and every sample covers the same 60 seconds
[bootstrap.directories."/etc/systemd/system/sysstat-collect.timer.d"]

[bootstrap.files."/etc/systemd/system/sysstat-collect.timer.d/every-minute.conf"]
content = """
[Timer]
OnCalendar=
OnCalendar=*:*:00
AccuracySec=1s
"""
notify = ["sysstat-collect.timer"]

[bootstrap.services.sysstat]
enabled = true

[bootstrap.services."sysstat-collect.timer"]
on_change = "restart"

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

[dotfiles]
"~/.config/git/allowed_signers" = {}
"~/.config/git/config" = {}
"~/.config/mise/config.toml" = {}
"~/.config/shell/aliases" = {}
"~/.paseo/config.json" = {}
"~/.pi/agent/settings.json" = {}
"~/.zshrc" = {}

# The shims lead PATH so each agent gets the Ruby or Node its repository pins, and SHELL opens every Paseo terminal in zsh
[bootstrap.linux.systemd.units.paseo]
description = "Paseo daemon"
exec_start = "%h/.local/share/mise/shims/paseo daemon run"
restart = "on-failure"
environment = { PATH = "%h/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin", SHELL = "/usr/bin/zsh" }

# The global tools only, from the home directory: projects pin their own versions. Paseo restarts when the daemon runs an older version than the one installed
[bootstrap.linux.systemd.units.mise-upgrade]
description = "Upgrade the global mise tools"
type = "oneshot"
exec_start = "/usr/bin/mise upgrade"
exec_start_post = ['''/bin/sh -c 'test "$$(%h/.local/share/mise/shims/paseo daemon status --json | jq -r .daemonVersion)" = "$$(%h/.local/share/mise/shims/paseo --version)" || systemctl --user restart dev.mise.paseo'''']
start = false
wanted_by = []

[bootstrap.linux.systemd.units.mise-upgrade-daily]
description = "Upgrade the global mise tools daily"
on_calendar = "*-*-* 04:00 Europe/Paris"
persistent = true
unit = "mise-upgrade"

# Run by mise bootstrap, once the dotfiles are in place
[tasks.bootstrap]
depends = ["setup:*"]

# Lets francois run tailscale serve without sudo, as patoumatic's bin/dev --tailscale does
[tasks."setup:tailscale-operator"]
run = "sudo tailscale set --operator=$USER"

# gh has no manifest for extensions, and badger's bin/ci runs gh signoff once its checks pass
[tasks."setup:gh-signoff"]
run = "gh extension list | grep -q basecamp/gh-signoff || gh extension install basecamp/gh-signoff"

# Run once after tailscale up: tailscaled keeps the mapping across restarts and reboots
[tasks."tailscale:serve-paseo"]
description = "Serve the Paseo daemon to the tailnet over HTTPS on its own port, 6767"
run = "tailscale serve --bg --https=6767 http://127.0.0.1:6767"
