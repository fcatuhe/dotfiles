[settings]
experimental = true

[bootstrap.packages]
"brew-cask:vscodium" = "latest"

# Repositories cloned before the dotfiles, which write key files into them
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting" }
"~/fcode/crooz" = { url = "git@github.com:fcatuhe/crooz.git" }
"~/fcode/patoumatic" = { url = "git@github.com:fcatuhe/patoumatic.git" }
"~/fcode/pi-wares" = { url = "git@github.com:fcatuhe/pi-wares.git" }
"~/fcode/skyblip" = { url = "git@github.com:fcatuhe/skyblip.git" }
"~/rcode/badger" = { url = "git@github.com:Ridecell/badger.git" }
"~/rcode/ridebi-forge" = { url = "git@github.com:Ridecell/ridebi-forge.git" }
"~/rcode/rideval_cpo_roi" = { url = "git@github.com:Ridecell/rideval_cpo_roi.git" }
"~/rcode/slides" = { url = "git@github.com:Ridecell/slides.git" }

[bootstrap.secrets]
PATOUMATIC_SERVER_IP = "PATOUMATIC_SERVER_IP"
PATOUMATIC_SERVER_USER = "PATOUMATIC_SERVER_USER"
CROOZ_SERVER_IP = "CROOZ_SERVER_IP"
CROOZ_SERVER_USER = "CROOZ_SERVER_USER"
AZADE_SERVER_IP = "AZADE_SERVER_IP"
AZADE_SERVER_USER = "AZADE_SERVER_USER"
AZADE_TAILSCALE_IP = "AZADE_TAILSCALE_IP"
FLYZILLA_SERVER_IP = "FLYZILLA_SERVER_IP"
FLYZILLA_SERVER_USER = "FLYZILLA_SERVER_USER"
RIDECELL_AWS_SSO_START_URL = "RIDECELL_AWS_SSO_START_URL"
RIDECELL_AWS_SSO_ACCOUNT_ID = "RIDECELL_AWS_SSO_ACCOUNT_ID"
BRAVE_API_KEY = "BRAVE_API_KEY"
PATOUMATIC_RAILS_DEVELOPMENT_KEY = "PATOUMATIC_RAILS_DEVELOPMENT_KEY"
CROOZ_RAILS_DEVELOPMENT_KEY = "CROOZ_RAILS_DEVELOPMENT_KEY"

[dotfiles]
"~/.aws/config" = { source = ".aws/config.tmpl", mode = "template", permissions = "0600" }
"~/.config/gh/config.yml" = {}
"~/.config/ghostty/config" = {}
"~/.config/git/allowed_signers" = {}
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/mise/config.toml" = {}
"~/.config/openlogi/config.toml" = { mode = "copy" }
"~/.config/shell/aliases" = {}
"~/.pi/agent/extensions/pi-model-shortcuts.json" = {}
"~/.pi/agent/keybindings.json" = {}
"~/.pi/agent/mcp.json" = {}
"~/.pi/agent/pi-codex-subagents/config.json" = {}
"~/.pi/agent/settings.json" = {}
"~/.ssh/config" = { source = ".ssh/config.tmpl", mode = "template", permissions = "0600" }
"~/.zprofile" = {}
"~/.zshenv" = {}
"~/.zshenv.private" = { source = ".zshenv.private.tmpl", mode = "template", permissions = "0600" }
"~/.zshrc" = {}
"~/Library/Application Support/VSCodium/User/settings.json" = {}
"~/fcode/crooz/config/master.key" = { source = "fcode/crooz/config/master.key.tmpl", mode = "template", permissions = "0600" }
"~/fcode/patoumatic/config/master.key" = { source = "fcode/patoumatic/config/master.key.tmpl", mode = "template", permissions = "0600" }

# Frees ctrl+space for the terminal: hotkey 60 is "Select the previous input source"
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"]
value = { enabled = false, value = { type = "standard", parameters = [32, 49, 262144] } }

# 30ms per repeat after a 225ms delay, the System Settings maximum, in 15ms units
[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.dock]
mru_spaces = false

# Hot corners: none (1), except bottom right puts the display to sleep (10)
[bootstrap.macos.defaults."com.apple.dock"]
wvous-tl-corner = 1
wvous-tr-corner = 1
wvous-bl-corner = 1
wvous-br-corner = 10
wvous-br-modifier = 0

# Applies the hotkey change without a logout
[bootstrap.hooks]
post-defaults = "/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u"

# Run by mise bootstrap, once the dotfiles are in place
[tasks.bootstrap]
depends = ["setup:*"]

[tasks."setup:repos"]
run = [
  "mise bootstrap repos exec -- mise trust --quiet",
  "mise bootstrap repos exec -- mise install",
]

[tasks."setup:vscodium"]
run = [
  "codium --install-extension esbenp.prettier-vscode",
  "codium --install-extension github.vscode-pull-request-github",
  "codium --install-extension marcoroth.herb-lsp",
  "codium --install-extension marcoroth.stimulus-lsp",
  "codium --install-extension marcoroth.turbo-lsp",
  "codium --install-extension shopify.ruby-lsp",
  "codium --install-extension sianglim.slim",
]

[tasks."vscodium:dump"]
description = "Snapshot VSCodium's activity bar, status bar and view layout into vscodium/layout.sql"
run = '''
sqlite3 -readonly ~/Library/Application\ Support/VSCodium/User/globalStorage/state.vscdb ".mode insert ItemTable" "
  SELECT key, value FROM ItemTable WHERE key IN (
    'workbench.activity.pinnedViewlets2',
    'workbench.activity.showAccounts',
    'workbench.explorer.views.state.hidden',
    'workbench.scm.views.state.hidden',
    'workbench.statusbar.hidden'
  ) ORDER BY key" > vscodium/layout.sql
'''

[tasks."vscodium:apply"]
description = "Write vscodium/layout.sql into VSCodium's state, effective at next launch"
run = '''
if pgrep -x VSCodium > /dev/null; then
  echo "vscodium:apply: quit VSCodium first, it writes its state back on exit" >&2
  exit 1
fi
mkdir -p ~/Library/Application\ Support/VSCodium/User/globalStorage
{
  echo "CREATE TABLE IF NOT EXISTS ItemTable (key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB);"
  cat vscodium/layout.sql
} | sqlite3 ~/Library/Application\ Support/VSCodium/User/globalStorage/state.vscdb
'''
