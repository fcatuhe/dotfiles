[settings]
experimental = true

# Brave Origin for arm64 comes from Brave's own repository, Debian has none. Its keyring holds three keys
[bootstrap.apt.sources.brave-browser]
uris = "https://brave-browser-apt-release.s3.brave.com"
suites = "stable"
key = "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg"
fingerprint = [
  "DBF1 A116 C220 B8C7 164F  9823 0686 B784 2003 8257",
  "47D3 2A74 E9A9 E013 A4B4  926C 68D5 13D3 6A73 CD96",
  "B2A3 DCA3 50E6 7256 740D  F904 DE4E C67B E4B0 DCA0",
]

[bootstrap.apt.sources.tailscale]
uris = "https://pkgs.tailscale.com/stable/debian"
key = "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
fingerprint = "2596 A99E AAB3 3821 893C  0A79 458C A832 957F 5868"

[bootstrap.packages]
"apt:brave-origin" = "latest"
"apt:novnc" = "latest"
"apt:tailscale" = "latest"
"apt:websockify" = "latest"
"apt:x11vnc" = "latest"
"apt:xauth" = "latest"
"apt:xvfb" = "latest"
"apt:zsh" = "latest"
"apt:zsh-autosuggestions" = "latest"
"apt:zsh-syntax-highlighting" = "latest"

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

[dotfiles]
"~/.config/herdr/config.toml" = {}
"~/.config/mise/config.toml" = {}
"~/.config/shell/aliases" = {}
"~/.pi/agent/keybindings.json" = {}
"~/.pi/agent/settings.json" = {}
"~/.zshrc" = {}

# The display, VNC and noVNC talk over the cookie and runtime-dir sockets only francois can open, never over TCP
[bootstrap.linux.systemd.units.xvfb]
description = "Virtual display :99 for the headed browser"
exec_start_pre = ["/bin/sh -c 'xauth -f %h/.Xauthority add :99 . $$(mcookie)'"]
exec_start = "/usr/bin/Xvfb :99 -screen 0 1440x900x24 -auth %h/.Xauthority -nolisten tcp"
restart = "always"

[bootstrap.linux.systemd.units.x11vnc]
description = "VNC server for display :99"
after = ["dev.mise.xvfb.service"]
binds_to = ["dev.mise.xvfb.service"]
exec_start = "/usr/bin/x11vnc -display :99 -auth %h/.Xauthority -unixsock %t/x11vnc.sock -rfbport 0 -forever -shared -noxdamage"
restart = "always"

[bootstrap.linux.systemd.units.novnc]
description = "noVNC for display :99, served on the tailnet by tailscale serve"
after = ["dev.mise.x11vnc.service"]
exec_start = "/usr/bin/websockify --web=/usr/share/novnc --unix-listen=%t/novnc.sock --unix-target=%t/x11vnc.sock"
restart = "always"

# Run by mise bootstrap, once the dotfiles are in place
[tasks.bootstrap]
depends = ["setup:*"]

# Tailnet only, with a Tailscale certificate. Serving a socket needs root, even for the operator
[tasks."setup:tailscale-serve"]
run = 'sudo tailscale serve --bg --https=6080 "unix:/run/user/$(id -u)/novnc.sock"'
